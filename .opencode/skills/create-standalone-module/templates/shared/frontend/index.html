<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{menu_label}</title>
    <link rel="stylesheet" href="/shared/core.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container module-page" id="app">
        <header class="page-header mb-8">
            <div>
                <div class="page-header-container">
                    <h1>{menu_label}</h1>
                    <span class="viz-version" id="viz-version" aria-label="Versao do modulo"></span>
                </div>
                <p class="text-muted">{menu_description}</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btn-novo">+ Novo {entity_name}</button>
            </div>
        </header>

        <div class="filters-row mb-8">
            <input type="text" class="form-control" id="search-input" placeholder="Buscar...">
        </div>

        <div id="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
            <div id="empty-state" class="state-panel" style="display:none">
                <strong>Nenhum registro encontrado.</strong>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-entity" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="display:none">
        <div class="modal-card">
            <header class="modal-header">
                <h3 id="modal-title">Novo {entity_name}</h3>
            </header>
            <form id="form-entity">
                <div class="form-group">
                    <label for="field-nome">Nome</label>
                    <input type="text" id="field-nome" name="nome" required minlength="2" maxlength="100">
                </div>
            </form>
            <footer class="modal-footer">
                <button type="button" class="btn" id="btn-cancel">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btn-save">Salvar</button>
            </footer>
        </div>
    </div>
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="version.js"></script>
    <script src="script.js"></script>
</body>
</html>
